# Configuración de Voice Agent Bridge. Copiar a /etc/voice-agent-bridge/config.yaml.
# Los SECRETOS van en /etc/voice-agent-bridge/voice-agent-bridge.env (ver voice-agent-bridge.env.example).

# Nombre del agente: dispositivo en Home Assistant y prefijo de entidades (danny → sensor.danny_estado)
name: Danny
timezone: America/Costa_Rica
state_file: /var/lib/voice-agent-bridge/state.json
log_level: INFO

elevenlabs:
  agent_id: agent_9401m4hv6mgaecp9jbtbcwwan1qw
  base_url: https://api.elevenlabs.io
  greetings_file: /opt/voice-agent-bridge/personas/danny/saludos.txt
  cost_per_min_usd: 0.08

session:
  max_session_s: 240        # tope por grupo (el agente tiene 300 s como red de seguridad)
  idle_timeout_s: 20        # sin que los usuarios hablen → el agente se despide
  farewell_timeout_s: 12    # espera a que el agente se despida y cuelgue
  cooldown_s: 30            # pausa antes de aceptar un nuevo "visitante detectado"
  playback_tail_ms: 300     # micrófono en silencio tras terminar de hablar (anti-eco)
  input_chunk_ms: 100

terminal:
  type: websocket           # websocket (AtomS3R) | local (micrófono/parlante del equipo)
  websocket:
    host: 0.0.0.0
    port: 8765

mqtt:
  enabled: true
  host: 192.168.1.10        # IP de tu broker (Mosquitto de Home Assistant)
  port: 1883
  username: voice-agent-bridge
  discovery_prefix: homeassistant
